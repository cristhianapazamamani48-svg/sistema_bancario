# =============================================================
# Configuración Nginx - Aether Bank
# Archivo: /etc/nginx/sites-available/aether-bank
# =============================================================
#
# INSTRUCCIONES DE INSTALACIÓN EN UBUNTU SERVER:
#   1. Copiar este archivo a /etc/nginx/sites-available/aether-bank
#   2. Crear enlace simbólico: 
#      sudo ln -s /etc/nginx/sites-available/aether-bank /etc/nginx/sites-enabled/
#   3. Editar server_name con tu dominio o IP
#   4. Editar root con la ruta correcta al proyecto en tu servidor
#   5. Verificar config: sudo nginx -t
#   6. Recargar Nginx: sudo systemctl reload nginx
# =============================================================

server {
    listen 80;
    
    # ⚠️ CAMBIAR: Reemplaza con tu dominio o IP pública del servidor Ubuntu
    server_name TU_DOMINIO_O_IP;

    # ⚠️ CAMBIAR: Ruta absoluta a la carpeta frontend/dist en tu servidor Ubuntu
    # Ejemplo: /home/cristhian/proyecto_ing/frontend/dist
    root /ruta/del/proyecto/frontend/dist;
    index index.html;

    # Logs de acceso y errores (útil para depuración)
    access_log /var/log/nginx/aether-bank.access.log;
    error_log  /var/log/nginx/aether-bank.error.log;

    # -------------------------------------------------------
    # FRONTEND (React SPA)
    # Sirve la aplicación React. Cualquier ruta que no sea /api
    # retorna index.html para que React Router maneje la navegación.
    # -------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -------------------------------------------------------
    # BACKEND API (Proxy Inverso → NestJS en puerto 3000)
    # Todas las peticiones que el frontend hace a /api/...
    # son redirigidas internamente al backend NestJS.
    # El usuario externo nunca ve el puerto 3000.
    # -------------------------------------------------------
    location /api/ {
        # Redirige /api/auth/login  →  localhost:3000/auth/login (elimina el /api)
        proxy_pass http://127.0.0.1:3000/;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeout generoso para operaciones bancarias complejas
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # -------------------------------------------------------
    # Swagger API Docs - Accesible en /api-docs
    # -------------------------------------------------------
    location /api-docs {
        proxy_pass http://127.0.0.1:3000/api-docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # -------------------------------------------------------
    # Archivos estáticos con caché agresivo (JS, CSS, imágenes)
    # -------------------------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # -------------------------------------------------------
    # Seguridad básica
    # -------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
